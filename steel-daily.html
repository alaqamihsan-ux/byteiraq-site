<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="السجل اليومي">
<title>السجل اليومي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a1530'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E📅%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a1530'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E📅%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07101f;--top:#0a1530;--card:#0e1c37;--bd:#2c4b80;--txt:#f3f6fb;--mut:#9fb0cc;--gold:#f5b82e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--top);border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header h1{margin:0;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
header h1 .mk{width:22px;height:18px;background:repeating-linear-gradient(115deg,var(--gold) 0 4px,transparent 4px 7px);transform:skewX(-10deg)}
header .upd{font-size:12px;color:var(--mut);margin-top:2px}
.dbar{display:flex;gap:6px;align-items:center;margin-top:8px}
.dbar button{flex:0 0 44px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:18px}
.dbar input{flex:1;height:40px;border-radius:10px;border:1px solid var(--gold);background:var(--card);color:var(--txt);font:inherit;font-weight:800;text-align:center;padding:0 8px}
.dbar .today{flex:0 0 auto;padding:0 12px;font-size:14px;font-weight:800;font-family:inherit}
main{padding:12px;max-width:720px;margin:0 auto}
.dname{font-weight:900;font-size:16px;margin:2px 0 10px;color:var(--gold)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.c span{display:block;font-size:12px;color:var(--mut);font-weight:700}
.c b{display:block;font-size:19px;direction:ltr;text-align:right;unicode-bidi:plaintext}
.c.hl{border-color:var(--gold);grid-column:1/-1}.c.hl b{color:var(--gold);font-size:24px}
h2{font-size:16px;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
h2 small{color:var(--mut);font-weight:700;font-size:12px}
.m{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;border-right:4px solid var(--bd)}
.m.out{border-right-color:#ef4444}.m.in{border-right-color:#22c55e}.m.ret{border-right-color:#eab308}.m.pay{border-right-color:#3b82f6}
.m .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m .p{font-weight:900;font-size:15px}
.m .t{font-size:12px;color:var(--mut);direction:ltr}
.m .det{font-size:13px;color:#cfd8ea;margin:4px 0}
.m .f{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut)}
.m .f b{color:var(--txt);direction:ltr;unicode-bidi:plaintext}
.tag{display:inline-block;padding:0 9px;border-radius:20px;font-size:12px;font-weight:800;margin-left:6px}
.tag.out{background:#5a1a16;color:#fca5a5}.tag.in{background:#14532d;color:#86efac}.tag.ret{background:#3b3b0e;color:#fde68a}.tag.pay{background:#0d3460;color:#93c5fd}
.empty{text-align:center;color:var(--mut);padding:30px 10px;background:var(--card);border-radius:12px;border:1px dashed var(--bd)}
.low{background:#2a1416;border:1px solid #6b2a35;border-radius:12px;padding:8px 10px;font-size:13px;color:#fca5a5;margin-top:8px}
.err{background:#5a1a16;color:#ffd2cc;border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;margin-bottom:10px;display:none}
.filters{display:flex;gap:6px;overflow:auto;margin-bottom:8px}
.filters button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:20px;padding:4px 14px;font:inherit;font-size:13px;font-weight:800}
.filters button.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
footer{text-align:center;font-size:10px;color:#56627a;padding:18px 0 24px}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1><span class="mk"></span><span id="shop">السجل اليومي</span></h1>
  <div class="upd" id="upd">جارِ التحميل…</div>
  <div class="dbar">
    <button onclick="shift(-1)" aria-label="اليوم السابق">→</button>
    <input type="date" id="d">
    <button onclick="shift(1)" aria-label="اليوم التالي">←</button>
    <button class="today" onclick="setDay(today())">اليوم</button>
    <button onclick="load(true)" aria-label="تحديث" id="rf">⟳</button>
  </div>
</header>
<main>
  <div class="err" id="err"></div>
  <div class="dname" id="dname"></div>
  <div class="cards" id="sum"></div>
  <h2>الحركات <small id="cnt"></small></h2>
  <div class="filters" id="flt"></div>
  <div id="list"></div>
  <h2>ملخص عام</h2>
  <div class="cards" id="info"></div>
  <div id="lowBox"></div>
</main>
<footer>برمجة وتصميم Byte للحلول البرمجية — المهندس احسان العكام</footer>
<script>
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fm=n=>Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const $=s=>document.querySelector(s);
// read link params (#db=...&k=...) and remember them
let cfg={};try{cfg=JSON.parse(localStorage.getItem('sd_cfg')||'{}')}catch(e){}
const hp=new URLSearchParams(location.hash.slice(1));
if(hp.get('db')&&hp.get('k')){cfg={db:hp.get('db').replace(/\/+$/,''),k:hp.get('k')};try{localStorage.setItem('sd_cfg',JSON.stringify(cfg))}catch(e){}}
let day=today(),info=null,data=null,flt='';
const TYPES=[['','الكل'],['out','بيع'],['in','شراء'],['ret','راجع'],['pay','تسديد']];
function showErr(m){const e=$('#err');e.textContent=m;e.style.display=m?'block':'none'}
function setDay(d){day=d;$('#d').value=d;load()}
function shift(n){const d=new Date(day+'T12:00');d.setDate(d.getDate()+n);setDay(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()))}
$('#d').value=day;$('#d').onchange=e=>setDay(e.target.value||today());
async function get(path){const r=await fetch(`${cfg.db}/s/${cfg.k}/${path}.json`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
let busy=false;
async function load(btn){
  if(!cfg.db||!cfg.k){showErr('افتح هذه الصفحة من الرابط اللي يطلع بالبرنامج (الإعدادات ← الموبايل).');$('#upd').textContent='';return}
  if(busy)return;busy=true;$('#rf').innerHTML='<span class="spin">⟳</span>';
  try{
    [info,data]=await Promise.all([get('info'),get('days/'+day)]);
    showErr(info?'':'لا توجد بيانات بعد — تأكد إن المزامنة مفعّلة بالبرنامج.');
    render();
  }catch(e){showErr(navigator.onLine===false?'لا يوجد إنترنت بالموبايل.':'تعذر جلب البيانات — تأكد من الرابط.')}
  busy=false;$('#rf').textContent='⟳';
}
function render(){
  const cur=(info&&info.cur)||'د.ع';
  if(info){$('#shop').textContent=info.shop||'السجل اليومي';document.title='السجل اليومي - '+(info.shop||'');
    const ago=Math.round((Date.now()-info.at)/60000);
    $('#upd').textContent='آخر تحديث من المحل: '+new Date(info.at).toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})+(ago<1?' (الآن)':ago<60?` (قبل ${ago} دقيقة)`:'');}
  const d=new Date(day+'T12:00');$('#dname').textContent=DAYS[d.getDay()]+' '+day.replace(/-/g,'/')+(day===today()?' — اليوم':'');
  const s=(data&&data.sum)||{sales:0,pur:0,pin:0,pout:0,cin:0,cout:0};
  $('#sum').innerHTML=`<div class="c hl"><span>صافي الصندوق</span><b>${fm(s.cin-s.cout)} ${cur}</b></div>
   <div class="c"><span>مبيعات اليوم</span><b>${fm(s.sales)}</b></div><div class="c"><span>مشتريات اليوم</span><b>${fm(s.pur)}</b></div>
   <div class="c"><span>قطع خارجة</span><b>${fm(s.pout)}</b></div><div class="c"><span>قطع داخلة</span><b>${fm(s.pin)}</b></div>
   <div class="c"><span>مجموع القبض</span><b>${fm(s.cin)}</b></div><div class="c"><span>مجموع الصرف</span><b>${fm(s.cout)}</b></div>`;
  const rows=((data&&data.rows)||[]);
  $('#flt').innerHTML=TYPES.map(([k,n])=>{const c=k?rows.filter(r=>r.ty===k).length:rows.length;return `<button class="${k===flt?'on':''}" onclick="flt='${k}';render()">${n} (${c})</button>`}).join('');
  const L=rows.filter(r=>!flt||r.ty===flt).slice().reverse();
  $('#cnt').textContent=rows.length?rows.length+' حركة':'';
  $('#list').innerHTML=L.length?L.map(r=>`<div class="m ${r.ty}"><div class="h"><div><span class="tag ${r.ty}">${esc(r.tl)}</span><span class="p">${esc(r.p||'نقدي')}</span></div><span class="t">${esc(r.t)} · ${esc(r.ref)}</span></div>
   ${r.det?`<div class="det">${esc(r.det)}</div>`:''}
   <div class="f"><span>المبلغ: <b>${fm(r.amt)}</b></span>${r.cin?`<span>قبض: <b>${fm(r.cin)}</b></span>`:''}${r.cout?`<span>صرف: <b>${fm(r.cout)}</b></span>`:''}${r.pout?`<span>خروج: <b>${r.pout}</b> قطعة</span>`:''}${r.pin?`<span>دخول: <b>${r.pin}</b> قطعة</span>`:''}</div></div>`).join('')
   :'<div class="empty">لا توجد حركات في هذا اليوم</div>';
  if(info){$('#info').innerHTML=`<div class="c"><span>الذمم المدينة (لنا)</span><b>${fm(info.recv)}</b></div><div class="c"><span>الذمم الدائنة (علينا)</span><b>${fm(info.pay)}</b></div>
   <div class="c"><span>رصيد المخزن</span><b>${fm(info.stock)} قطعة</b></div><div class="c"><span>وزن المخزن</span><b>${(+info.tons||0).toFixed(2)} طن</b></div>`;
   $('#lowBox').innerHTML=info.low&&info.low.length?`<div class="low">🔔 أصناف قليلة أو نافدة: ${info.low.map(esc).join('، ')}</div>`:'';}
}
render();load();
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
</body>
</html>
