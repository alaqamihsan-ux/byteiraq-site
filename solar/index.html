/* تخطيط: شريط جانبي ثابت يمين + مساحة عمل، وطبقة طباعة A4 مستقلة */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --surface2:#f8f8fc; --ink:#191b33; --muted:#5d6079; --line:#dfe1ec;
  --accent:#262a6e; --accent-ink:#ffffff; --accent-soft:#e6e7f5; --gold:#e8a820;
  --ok:#15803d; --ok-soft:#e3f4e8; --warn:#b45309; --warn-soft:#fdf0dc; --bad:#b42318; --bad-soft:#fbe5e2;
  --side:#1d2160; --side-ink:#e3e5fa; --side-muted:#a2a6d6;
  --f-ui:"Cairo", Tahoma, "Segoe UI", sans-serif;
  --f-disp:"Hacen Saudi Arabia", "Cairo", Tahoma, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1020; --surface:#171a2e; --surface2:#1c2036; --ink:#e6e7f5; --muted:#9a9dbb; --line:#2c3050;
  --accent:#f0b733; --accent-ink:#1a1400; --accent-soft:#2e2a1a; --gold:#f0b733;
  --ok:#4ade80; --ok-soft:#173225; --warn:#f0a44b; --warn-soft:#3a2a14; --bad:#f8796b; --bad-soft:#3d1c19;
  --side:#0b0c1e; --side-ink:#dfe1f5; --side-muted:#8c90b8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1020; --surface:#171a2e; --surface2:#1c2036; --ink:#e6e7f5; --muted:#9a9dbb; --line:#2c3050;
  --accent:#f0b733; --accent-ink:#1a1400; --accent-soft:#2e2a1a; --gold:#f0b733;
  --ok:#4ade80; --ok-soft:#173225; --warn:#f0a44b; --warn-soft:#3a2a14; --bad:#f8796b; --bad-soft:#3d1c19;
  --side:#0b0c1e; --side-ink:#dfe1f5; --side-muted:#8c90b8; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-disp);font-size:22px;line-height:1.2;padding:0 10px 4px}
.brand-sub{font-size:12px;color:var(--side-muted);padding:0 10px 18px}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--side-ink)}
.nav:hover{background:rgba(255,255,255,.06)}
.nav:focus-visible{outline:2px solid var(--accent)}
.nav.on{background:#e8a820;color:#1a1400;font-weight:700}
.brand-logo{background:#fff;border-radius:14px;padding:10px;margin:0 6px 10px;display:flex;justify-content:center}
.brand-logo img{width:100%;max-width:170px;height:auto;display:block}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:10px}
@media(max-width:800px){.papers-grid{grid-template-columns:1fr !important}}

main{padding:26px max(16px,2.4vw) 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-disp);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted)}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:21px;font-weight:700;margin-top:2px}
.kpi>span{color:var(--muted);font-size:13px}
.kpi.alert b{color:var(--bad)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;min-width:420px}
.t th{background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--surface2)}
.t input{width:100%;min-width:70px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.search{min-width:220px;flex:1;max-width:340px}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* محرر الفاتورة */
.inv-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.totals{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl.big{font-size:20px;font-weight:700;border-top:1px dashed var(--line);padding-top:10px}
.tl.rem b{color:var(--bad)}
.tl input{width:130px;text-align:left}

.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:13px}
.preset i{width:14px;height:14px;border-radius:50%;display:inline-block}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);font-weight:600}
input[type=color]{height:40px;padding:3px;width:100%}
.mini{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:6px;color:#1a1d2e}
.mp-head{border-bottom:3px solid var(--p-acc);padding-bottom:6px;color:var(--p-acc);box-shadow:0 2px 0 var(--p-acc2)}
.mp-title{align-self:flex-start;background:var(--p-acc);color:#fff;padding:2px 12px;border-radius:4px;border-right:4px solid var(--p-acc2);font-size:13px}
.mp-row{height:12px;background:color-mix(in srgb,var(--p-acc) 8%,#fff);border:1px solid #dde}
.mp-rem{align-self:flex-end;background:var(--p-acc);color:#fff;padding:2px 14px;border-radius:4px;font-size:12px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:13px}
.slot-img{height:80px;width:100%;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px}
.slot-img img{max-height:76px;max-width:100%}.slot-img span{color:#888;font-size:12px}
.fontprev{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface2)}
.fontprev b{font-size:20px;color:var(--accent)}
/* نافذة */
.mask{position:fixed;inset:0;background:rgba(10,20,18,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h3{margin:0 0 14px;font-size:18px}
.modal .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}
.toast{position:fixed;bottom:20px;left:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60}

@media (max-width:860px){
  .brand-logo{width:90px;padding:6px}
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}
  .brand-sub,.side-foot{display:none}
  .brand{width:100%;padding-bottom:8px}
  .nav{padding:8px 10px}
  .inv-wrap{grid-template-columns:1fr}
}
#menuBtn{display:none}
@media (max-width:760px){
  .side{position:sticky;top:0;z-index:50;align-items:center;gap:6px;padding:8px 12px;max-height:100vh;overflow-y:auto}
  .brand-logo{width:54px;padding:3px}
  #menuBtn{display:flex;align-items:center;gap:6px;margin-inline-start:auto;all:unset;cursor:pointer;display:flex;padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.12);color:var(--side-ink);font-size:15px}
  .side:not(.open) #nav,.side:not(.open) #serBox,.side:not(.open) #themeBtn,.side:not(.open) #userFoot{display:none!important}
  .side.open{flex-direction:column;align-items:stretch}
  .side.open #menuBtn{position:absolute;top:10px;left:12px}
  main{padding:14px 12px!important}
}

/* ===================== تصميم ورقة الطباعة A4 ===================== */
#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  body{background:#fff !important}
  .app,.mask,.toast{display:none !important}
  #printArea{display:block}
}
.sheet{
  --p-ink:#1a1d2e; --p-muted:#5f6475; --p-line:#d3d5df; --p-acc:#262a6e; --p-acc2:#e8a820; --p-soft:color-mix(in srgb,var(--p-acc) 7%,#fff);
  width:210mm;min-height:296mm;padding:9mm 12mm 7mm;margin:0 auto;background:#fff;color:var(--p-ink);
  font-family:var(--f-ui);font-size:11pt;display:flex;flex-direction:column;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-after:always;color-scheme:light;position:relative
}
.sheet:last-child{page-break-after:auto}
.s-head{display:grid;grid-template-columns:34mm 1fr 62mm;align-items:center;gap:5mm;padding-bottom:3mm;border-bottom:2.4pt solid var(--p-acc);position:relative}
.s-head::after{content:"";position:absolute;bottom:-5pt;right:0;width:45%;height:2.2pt;background:var(--p-acc2)}
.s-logo img{width:34mm;height:auto;display:block}
.s-logo.txt{width:24mm;height:24mm;border:1.5pt solid var(--p-acc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:20pt;color:var(--p-acc)}
.s-shop{font-family:var(--f-disp);font-size:19pt;color:var(--p-acc);line-height:1.25}
.s-sub{color:var(--p-acc2);font-size:9.5pt;font-weight:600;filter:brightness(.85)}
.s-contact{font-size:8.8pt;color:var(--p-ink);line-height:1.55;border-right:1.2pt solid var(--p-acc2);padding-right:3mm}
.s-contact i{font-style:normal;color:var(--p-muted);display:inline-block;min-width:12mm}
.s-titlebar{display:flex;justify-content:space-between;align-items:center;margin:6mm 0 3.5mm}
.s-title{font-family:var(--f-disp);font-size:16pt;background:var(--p-acc);color:#fff;padding:1.2mm 7mm;border-radius:1.5mm;border-right:3mm solid var(--p-acc2)}
.s-no{font-size:10.5pt;text-align:center}
.s-no b{font-size:13pt;color:var(--p-acc)}
.s-bc{display:flex;flex-direction:column;align-items:center;gap:1mm}
.s-info{display:grid;grid-template-columns:1fr 1fr;border:1pt solid var(--p-line);border-radius:2mm;overflow:hidden;margin-bottom:3.5mm}
.s-info div{padding:1.8mm 4mm;border-bottom:1pt solid var(--p-line);display:flex;gap:3mm}
.s-info div:nth-child(odd){border-left:1pt solid var(--p-line)}
.s-info div:nth-last-child(-n+2){border-bottom:0}
.s-info span{color:var(--p-muted);min-width:22mm}
.s-tbl{width:100%;border-collapse:collapse;font-size:10.3pt}
.s-tbl th{background:var(--p-acc);color:#fff;font-weight:600;padding:1.8mm;border:1pt solid var(--p-acc);text-align:center}
.s-tbl td{border:1pt solid var(--p-line);padding:1.3mm 2mm;text-align:center;height:7mm}
.s-tbl td.l{text-align:right}
.s-tbl .ln{display:block;font-size:8.5pt;color:var(--p-muted);margin-top:.4mm}
.s-tbl .ln::before{content:"◆ ";color:var(--p-acc2)}
.s-tbl tbody tr:nth-child(even) td{background:var(--p-soft)}
.s-tbl tfoot td{font-weight:700;background:var(--p-soft);border-top:1.5pt solid var(--p-acc)}
.s-bottom{display:grid;grid-template-columns:1fr 70mm;gap:6mm;margin-top:4mm;align-items:start}
.s-words{border:1pt dashed var(--p-acc2);border-radius:2mm;padding:2.5mm 4mm;font-size:10.3pt}
.s-words span{color:var(--p-muted);display:block;font-size:9pt}
.s-note{margin-top:3mm;font-size:10pt;color:var(--p-muted)}
.s-sum{border:1pt solid var(--p-line);border-radius:2mm;overflow:hidden}
.s-sum div{display:flex;justify-content:space-between;padding:1.7mm 4mm;border-bottom:1pt solid var(--p-line)}
.s-sum div:last-child{border-bottom:0}
.s-sum .net{background:var(--p-soft);font-weight:700}
.s-sum .paid{color:#15803d;font-weight:600}
.s-sum .rem{background:var(--p-acc);color:#fff;font-weight:700;font-size:12pt;border-right:2.5mm solid var(--p-acc2)}
.s-sign{display:grid;grid-template-columns:1fr 1fr;gap:24mm;margin-top:auto;padding-top:6mm;align-items:end}
.s-sign .box{text-align:center;position:relative;min-height:30mm;display:flex;flex-direction:column;justify-content:flex-end;gap:1mm}
.s-sign .lbl{border-top:1pt solid var(--p-ink);padding-top:1.5mm;font-size:10pt}
.s-sign .mgr{font-weight:700;font-size:10.5pt;position:relative;z-index:2}
.s-stamp{position:absolute;left:8mm;bottom:3mm;width:29mm;height:29mm;transform:rotate(-12deg);opacity:.82;object-fit:contain}
.s-sig{position:absolute;right:10mm;bottom:6mm;height:17mm;max-width:46mm;object-fit:contain;z-index:1}
.s-foot{margin-top:5mm;border-top:1pt solid var(--p-line);padding-top:2mm;display:flex;justify-content:space-between;font-size:8.5pt;color:var(--p-muted)}
@media screen{#printArea.preview{display:block;background:#888;padding:10mm 0}#printArea.preview .sheet{margin-bottom:10mm}}
</style>
</head>

const groupNum=v=>{const t=String(v??'');const m=t.replace(/,/g,'').match(/^(-?)(\d*)(\.\d*)?$/);if(!m||!m[2])return t;return m[1]+m[2].replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,',')+(m[3]||'')};
const isNumIn=el=>el&&el.tagName==='INPUT'&&(el.inputMode==='numeric'||el.inputMode==='decimal')&&!el.dataset.nogroup;
(()=>{const d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  Object.defineProperty(HTMLInputElement.prototype,'value',{configurable:true,enumerable:d.enumerable,get(){return d.get.call(this)},set(v){d.set.call(this,isNumIn(this)?groupNum(v):v)}});
  const fixAll=r=>{if(!r||!r.querySelectorAll)return;if(isNumIn(r))r.value=d.get.call(r);r.querySelectorAll('input[inputmode="numeric"],input[inputmode="decimal"]').forEach(el=>{const v=d.get.call(el),g=isNumIn(el)?groupNum(v):v;if(g!==v)d.set.call(el,g)})};
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(fixAll))).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('input',e=>{const el=e.target;if(!isNumIn(el))return;const v=d.get.call(el),c=el.selectionStart??v.length;

function tafqeet(n){
  n=Math.round(Math.abs(n));if(!n)return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const u1000=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(hund[h]);if(r){if(r<20)p.push(ones[r]);else{const u=r%10,t=Math.floor(r/10);p.push(u?ones[u]+' و'+tens[t]:tens[t])}}return p.join(' و')};
  const grp=(x,f)=>x===1?f[0]:x===2?f[1]:x<=10?u1000(x)+' '+f[2]:u1000(x)+' '+f[3];
  const parts=[],b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),t=Math.floor(n%1e6/1e3),r=n%1e3;
  if(b)parts.push(grp(b,['مليار','ملياران','مليارات','مليار']));
  if(m)parts.push(grp(m,['مليون','مليونان','ملايين','مليون']));
  if(t)parts.push(grp(t,['ألف','ألفان','آلاف','ألف']));
  if(r)parts.push(u1000(r));
  return parts.join(' و');
}

const roundP=v=>v>=1000?Math.ceil(v/250)*250:Math.round(v);
const hasMk=v=>v!==''&&v!==null&&v!==undefined;
function addMonths(d,m){const x=new Date((d||today())+'T00:00:00'),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+Math.floor(m));const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
const dDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const wText=m=>{m=N(m);if(!m)return '';if(m%12)return m+' شهر';const y=m/12;return y===1?'سنة':y===2?'سنتان':y<=10?y+' سنوات':y+' سنة'};
function wLeft(saleDate,m){
  if(!N(m))return {end:'',html:'<span style="color:var(--muted)">بدون ضمان</span>'};
  const end=addMonths(saleDate,N(m)),t=today();
  if(end<t)return {end,html:`<span class="pill bad">منتهي منذ ${fmt(dDiff(end,t))} يوم</span>`};
  let mm=0;while(addMonths(t,mm+1)<=end)mm++;const dd=dDiff(addMonths(t,mm),end);
  const txt=[mm?mm+' شهر':'',dd?dd+' يوم':''].filter(Boolean).join(' و ')||'آخر يوم';
  return {end,html:`<span class="pill ${mm<1?'warn':'ok'}">باقي ${txt}</span>`};
}
function ensureItem(it){
  if(!Array.isArray(it.batches))it.batches=it.qty>0?[{id:uid(),date:'',qty:it.qty,orig:it.qty,cost:it.cost,supplier:'رصيد سابق',warranty:N(it.warranty),note:''}]:[];
  const d={barcode:'',wholesale:0,markup:'',wmarkup:'',pack:'',packQty:0,packPrice:0,packBarcode:'',warranty:0};
  for(const k in d)if(it[k]===undefined)it[k]=d[k];
}
function migrateItems(){(db.items||[]).forEach(ensureItem);if(!db.cash)db.cash=[];if(!db.units)db.units=[];if(!db.pending)db.pending=[];
  if(!db.numFix){[...db.invoices].sort((a,b)=>a.no-b.no).forEach((v,k)=>{v.no=15754+k;v.prefix=''});db.nextNo=15754+db.invoices.length;db.numFix=1}
  db.settings.prefix='';if(!(db.nextNo>=15754))db.nextNo=15754+db.invoices.length}
const stockVal=it=>(it.batches&&it.batches.length)?it.batches.reduce((s,b)=>s+b.qty*b.cost,0):it.qty*it.cost;
function takeFIFO(it,q){
  ensureItem(it);const out=[];let r=q;
  for(const b of it.batches){if(r<=0)break;if(b.qty<=0)continue;const t=Math.min(b.qty,r);b.qty-=t;r-=t;out.push({bid:b.id,qty:t,cost:b.cost,supplier:b.supplier,date:b.date,warranty:b.warranty,note:b.note})}
  if(r>0)out.push({bid:'',qty:r,cost:it.cost,supplier:'',date:'',warranty:it.warranty,note:''});
  it.batches=it.batches.filter(b=>b.qty>0);return out;
}
function putBack(it,parts){
  ensureItem(it);
  parts.forEach(p=>{const b=p.bid&&it.batches.find(x=>x.id===p.bid);if(b)b.qty+=p.qty;else it.batches.push({id:p.bid||uid(),date:p.date||today(),qty:p.qty,orig:p.qty,cost:p.cost,supplier:p.supplier||'مرتجع',warranty:p.warranty||0,note:p.note||''})});
  it.batches.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

function costOpts(it){
  const bs=(it.batches||[]).filter(b=>b.qty>0),costs=[...new Set(bs.map(b=>b.cost))].sort((a,b)=>b-a);
  const max=costs.length?costs[0]:it.cost,avg=Math.round(it.qty>0&&bs.length?stockVal(it)/it.qty:it.cost);
  const o=[['max',max,`أعلى سعر شراء — ${fmt(max)}`],['last',it.cost,`آخر سعر شراء — ${fmt(it.cost)}`],['avg',avg,`متوسط سعر الشراء — ${fmt(avg)}`]];
  if(costs.length>1)costs.forEach(c=>{const g=bs.filter(b=>b.cost===c),q=g.reduce((s,b)=>s+b.qty,0),sp=[...new Set(g.map(b=>b.supplier).filter(Boolean))].join('، ');o.push(['v:'+c,c,`${fmt(c)} — ${fmt(q)} ${it.unit}${sp?' من '+sp:''}`])});
  return o;
}

function mCalc(src){

function scanFind(v){v=String(v||'').trim();if(!v)return null;let it=db.items.find(i=>i.barcode&&i.barcode===v);if(it)return {it,f:1};

function revertInv(inv){

  (db.units||[]).forEach(u=>{if(u.invId===inv.id){u.status='stock';u.invId=null}});
}
function applyInv(inv){
  inv.lines.forEach(l=>{const it=itemById(l.itemId);if(!it||!l.qty)return;const q=l.qty*(l.factor||1);l.batches=takeFIFO(it,q);l.cost=l.batches.reduce((s,b)=>s+b.qty*b.cost,0)/l.qty;it.qty-=q});
  inv.lines.forEach(l=>(l.serials||[]).forEach(sn=>{const u=unitBySerial(sn);if(u){u.status='sold';u.invId=inv.id}}));

const draftPays=()=>(draft.pays||[]).reduce((s,p)=>s+p.amount,0);
function saveInvoice(print){
  if(!draft.lines.length){toast('أضف مادة واحدة على الأقل');return}

  const need={};draft.lines.forEach(l=>need[l.itemId]=(need[l.itemId]||0)+l.qty*(l.factor||1));
  const back={};if(old)old.lines.forEach(l=>back[l.itemId]=(back[l.itemId]||0)+l.qty*(l.factor||1));
  for(const id in need){const it=itemById(id);if(it&&need[id]>it.qty+(back[id]||0)){toast(`الكمية غير كافية: ${it.name} (الموجود ${fmt(it.qty+(back[id]||0))} ${it.unit})`);return}}
  if((draft.paid||0)+draftPays()>net(draft)){toast('الواصل أكبر من الصافي');return}
  if(net(draft)-(draft.paid||0)-draftPays()>0&&!draft.customerId){toast('عليها باقي: اختر الزبون حتى يُسجل الدين باسمه');return}

    revertInv(old);const {editId,...d}=draft;Object.assign(old,d,{pays:draft.pays||[],edited:today()});applyInv(old);
    draft=null;lastScan=null;save();toast('تم تعديل الوصل رقم '+invNo(old));go('invoices');if(print)printInvoice(old.id);return;
  }
  draft.lines.forEach(l=>{const it=itemById(l.itemId);if(!it||!l.qty)return;const q=l.qty*(l.factor||1);l.batches=takeFIFO(it,q);l.cost=l.batches.reduce((s,b)=>s+b.qty*b.cost,0)/l.qty;it.qty-=q});
  const {editId:_e,...dd}=draft;const inv={...dd,id:uid(),prefix:'',no:db.nextNo++,pays:[],by:CUR?CUR.name:''};db.invoices.push(inv);
  inv.lines.forEach(l=>(l.serials||[]).forEach(sn=>{const u=unitBySerial(sn);if(u){u.status='sold';u.invId=inv.id}}));draft=null;lastScan=null;save();
  toast('تم حفظ الوصل رقم '+invNo(inv));render();if(print)printInvoice(inv.id);
}

let lastScan=null;
function beep(ok){try{const A=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.frequency.value=ok?1500:300;o.type=ok?'sine':'square';g.gain.value=.08;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+(ok?.08:.25))}catch(e){}}
function scanEnter(){
  const inp=$('#a_item'),raw=inp.value.trim();if(!raw)return;
  // صيغة الكمية: 3*الباركود
  const m=raw.match(/^(\d+(?:\.\d+)?)\s*[*xX×]\s*(.+)$/),code=m?m[2].trim():raw,q=m?N(m[1]):(N($('#a_qty').value)||1);
  const su=unitBySerial(code);
  if(su){
    const it=itemById(su.itemId);
    if(su.status==='sold'){beep(false);const iv=db.invoices.find(i=>i.id===su.invId);toast(`هذا الجهاز مُباع سابقاً${iv?' بالوصل '+invNo(iv):''}`);inp.value='';return}
    if(!it){beep(false);toast('مادة الجهاز محذوفة');inp.value='';return}
    if(draft.lines.some(l=>(l.serials||[]).includes(code))){beep(false);toast('هذا الجهاز مضاف للفاتورة');inp.value='';return}
    if(inDraftQty(it.id)+1>it.qty){beep(false);toast(`الكمية غير كافية: ${it.name}`);inp.value='';return}
    addToDraft(it,1,1);const ln=draft.lines.find(l=>l.itemId===it.id&&(l.factor||1)===1&&l.price===priceFor(it,1,draft.ptype));if(ln)ln.serials=[...(ln.serials||[]),code];
    beep(true);render();const a=$('#a_item');if(a){a.value='';a.focus()}return;
  }
  const r=scanFind(code);
  if(!r){
    if(/^[^\s]{3,}$/.test(raw)&&!db.items.some(i=>i.name.includes(raw))&&!db.items.some(i=>(i.code+' - '+i.name)===raw)){
      beep(false);inp.value='';
      modal('باركود غير معروف',`<p>لا توجد مادة بالباركود <b class="num">${esc(code)}</b>.</p>`,[['إضافة مادة جديدة بهذا الباركود','pri',()=>{setTimeout(()=>editItem(null,code),10)}],['إلغاء']]);
      return;
    }
    pickItem();if(findItemFromInput(raw)){$('#a_qty').focus();$('#a_qty').select()}else toast('اختر مادة من القائمة');return;
  }
  const {it,f}=r;
  if(inDraftQty(it.id)+q*f>it.qty){beep(false);toast(`الكمية غير كافية: ${it.name} (الموجود ${fmt(it.qty)} ${it.unit})`);inp.value='';inp.focus();return}
  addToDraft(it,f,q);beep(true);render();const a=$('#a_item');if(a){a.value='';a.focus()}
}

const C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function barcodeSVG(text,h){
  const codes=[104];let sum=104;
  [...String(text)].forEach((ch,i)=>{let v=ch.charCodeAt(0)-32;if(v<0||v>94)v=0;codes.push(v);sum+=v*(i+1)});
  codes.push(sum%103,106);
  let x=10,bars='';
  codes.forEach(c=>{[...C128[c]].forEach((w,j)=>{w=+w;if(j%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w})});
  return `<svg viewBox="0 0 ${x+10} ${h}" preserveAspectRatio="none" style="width:${(x+10)*0.34}mm;height:11mm;display:block" fill="#000">${bars}</svg>`;
}

const CASH_KINDS={capital:['إيداع رأس مال',1],deposit:['إيداع للقاصة',1],withdraw:['سحب من القاصة',-1],expense:['مصروف',-1],purchase:['شراء بضاعة',-1]};

function cashMoves(){
  const m=[];
  db.invoices.forEach(i=>{
    if(i.paid)m.push({date:i.date,amt:i.paid,kind:'sale',label:`بيع - وصل ${invNo(i)}`,who:custName(i)});

  });
  (db.cash||[]).forEach(c=>{const k=CASH_KINDS[c.kind]||['حركة',1];m.push({date:c.date,amt:k[1]*c.amount,kind:c.kind,label:k[0]+(c.note?' - '+c.note:''),who:c.who||'',id:c.id})});
  return m.sort((a,b)=>a.date.localeCompare(b.date));
}

function rPreset(p){const t=today(),d=new Date();
  if(p==='day'){rFrom=rTo=t}
  else if(p==='month'){rFrom=t.slice(0,8)+'01';rTo=t}
  else if(p==='last'){const x=new Date(d.getFullYear(),d.getMonth()-1,1),y=new Date(d.getFullYear(),d.getMonth(),0);const f=z=>z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0');rFrom=f(x);rTo=f(y)}
  else if(p==='year'){rFrom=t.slice(0,4)+'-01-01';rTo=t}
  else {rFrom='';rTo=''}
  render();

const kpi=(t,v,cls)=>`<div class="kpi ${cls||''}"><span>${t}</span><b>${v}</b></div>`;
const tbl=(head,rows,foot)=>rows.length?`<div class="tw"><table class="t"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>${foot?`<tfoot>${foot}</tfoot>`:''}</table></div>`:'<div class="empty">لا توجد بيانات بهذه الفترة.</div>';
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';

function salesData(){
  const invs=db.invoices.filter(i=>inR(i.date));
  const byItem={},byCust={},byDay={};
  invs.forEach(i=>{
    const c=custName(i);byCust[c]=byCust[c]||{n:0,s:0,r:0};byCust[c].n++;byCust[c].s+=net(i);byCust[c].r+=remain(i);
    byDay[i.date]=byDay[i.date]||{n:0,s:0,p:0,c:0};byDay[i.date].n++;byDay[i.date].s+=net(i);byDay[i.date].p+=profit(i);byDay[i.date].c+=i.lines.reduce((a,l)=>a+l.qty*(l.cost||0),0);
    i.lines.forEach(l=>{const k=l.itemId||l.name,it=itemById(l.itemId);const o=byItem[k]=byItem[k]||{name:l.name,unit:it?it.unit:l.unit,q:0,s:0,c:0};
      o.q+=l.qty*(l.factor||1);o.s+=l.qty*l.price;o.c+=l.qty*(l.cost||0)});
  });
  const S={invs,n:invs.length,total:invs.reduce((s,i)=>s+net(i),0),disc:invs.reduce((s,i)=>s+(i.discount||0),0),
    cost:invs.reduce((s,i)=>s+i.lines.reduce((a,l)=>a+l.qty*(l.cost||0),0),0),profit:invs.reduce((s,i)=>s+profit(i),0),
    paid:invs.reduce((s,i)=>s+paidAll(i),0),rem:invs.reduce((s,i)=>s+remain(i),0),
    items:Object.values(byItem).sort((a,b)=>b.s-a.s),custs:Object.entries(byCust).sort((a,b)=>b[1].s-a[1].s),days:Object.entries(byDay).sort((a,b)=>b[0].localeCompare(a[0]))};
  S.exp=(db.cash||[]).filter(c=>c.kind==='expense'&&inR(c.date)).reduce((s,c)=>s+c.amount,0);
  return S;
}
function purchData(){
  const ins=db.stockIns.filter(s=>inR(s.date));const bySup={},byItem={};
  ins.forEach(s=>{const a=s.qty*s.cost,k=s.supplier||'غير محدد';bySup[k]=bySup[k]||{n:0,a:0};bySup[k].n++;bySup[k].a+=a;
    const it=itemById(s.itemId),o=byItem[s.itemId]=byItem[s.itemId]||{name:s.name,unit:it?it.unit:'',q:0,a:0,min:Infinity,max:0};o.q+=s.qty;o.a+=a;o.min=Math.min(o.min,s.cost);o.max=Math.max(o.max,s.cost)});
  return {ins,total:ins.reduce((s,x)=>s+x.qty*x.cost,0),cash:(db.cash||[]).filter(c=>c.kind==='purchase'&&inR(c.date)).reduce((s,c)=>s+c.amount,0),
    sups:Object.entries(bySup).sort((a,b)=>b[1].a-a[1].a),items:Object.values(byItem).sort((a,b)=>b.a-a.a)};
}
function stockData(){
  const sold={},bought={};
  db.invoices.filter(i=>inR(i.date)).forEach(i=>i.lines.forEach(l=>sold[l.itemId]=(sold[l.itemId]||0)+l.qty*(l.factor||1)));
  db.stockIns.filter(s=>inR(s.date)).forEach(s=>bought[s.itemId]=(bought[s.itemId]||0)+s.qty);
  const rows=db.items.map(i=>({i,val:stockVal(i),rv:i.qty*i.price,sold:sold[i.id]||0,bought:bought[i.id]||0})).sort((a,b)=>b.val-a.val);
  return {rows,val:rows.reduce((s,r)=>s+r.val,0),rv:rows.reduce((s,r)=>s+r.rv,0),out:db.items.filter(i=>i.qty<=0).length,low:db.items.filter(i=>i.qty>0&&i.qty<=i.min).length};
}
function moneyData(){
  const all=cashMoves(),before=all.filter(x=>rFrom&&x.date<rFrom).reduce((s,x)=>s+x.amt,0);
  const moves=all.filter(x=>inR(x.date));let run=before;moves.forEach(x=>{run+=x.amt;x.bal=run});
  const sum=k=>moves.filter(x=>k.includes(x.kind)).reduce((s,x)=>s+Math.abs(x.amt),0);
  const cap=(db.cash||[]).filter(c=>c.kind==='capital').reduce((s,c)=>s+c.amount,0)-(db.cash||[]).filter(c=>c.kind==='withdraw').reduce((s,c)=>s+c.amount,0);
  const now=cashBalance(),stock=db.items.reduce((s,i)=>s+stockVal(i),0),debts=db.invoices.reduce((s,i)=>s+remain(i),0);
  return {moves,before,after:run,inn:moves.filter(x=>x.amt>0).reduce((s,x)=>s+x.amt,0),out:moves.filter(x=>x.amt<0).reduce((s,x)=>s-x.amt,0),
    sales:sum(['sale']),pays:sum(['pay']),deps:sum(['capital','deposit']),purch:sum(['purchase']),exp:sum(['expense']),wd:sum(['withdraw']),
    cap,now,stock,debts,worth:now+stock+debts};
}

let REMOTE=false,SBASE=null,sRev=0,sInflight=0,sQueue=[],sNeedRefresh=false,sOnline=true,sNeedRender=false;
const sClone=o=>JSON.parse(JSON.stringify(o));
function remoteSave(){
  if(!SBASE)return;const ops=BSYNC.diff(SBASE,db);if(!ops.length)return;SBASE=sClone(db);sQueue.push(ops);pumpQueue();
}
async function pumpQueue(){
  if(sInflight||!sQueue.length)return;sInflight=1;const ops=sQueue[0];
  try{const r=await fetch('/api/patch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ops})});if(!r.ok)throw new Error(r.status);const j=await r.json();
    sQueue.shift();if(j.rev===sRev+1)sRev=j.rev;else sNeedRefresh=true;setOnline(true)}
  catch(e){setOnline(false);sInflight=0;setTimeout(pumpQueue,3000);return}
  sInflight=0;if(sQueue.length)return pumpQueue();if(sNeedRefresh)remoteRefresh();
}
async function remoteRefresh(){
  if(sInflight||sQueue.length){sNeedRefresh=true;return}sNeedRefresh=false;
  try{const r=await fetch('/api/db',{cache:'no-store'});const j=await r.json();if(!j.data)return;
    if(sInflight||sQueue.length){sNeedRefresh=true;return}
    db=j.data;migrateItems();SBASE=sClone(db);sRev=j.rev;if(CUR)CUR=activeUsers().find(u=>u.id===CUR.id)||null;setOnline(true);safeRender()}catch(e){setOnline(false)}

    if(!name||!un){toast('اكتب الاسم واسم المستخدم');return false}
    if(L.some(x=>x.user===un&&x!==u)){toast('اسم المستخدم مستخدم');return false}
    if(!id&&pw.length<4){toast('كلمة السر لازم 4 أحرف أو أكثر');return false}
    if(id&&pw&&pw.length<4){toast('كلمة السر لازم 4 أحرف أو أكثر');return false}
    const act=id?$('#u_act').checked:true;
    if(u.role==='admin'&&(role!=='admin'||!act)&&L.filter(x=>x.role==='admin'&&x.active!==false&&x!==u).length===0){toast('لازم يبقى مدير فعّال واحد على الأقل');return false}
    const perms={};PERMS.forEach(([k])=>perms[k]=role==='seller'&&$('#up_'+k).checked);
    Object.assign(u,{name,user:un,role,perms,active:act});
    if(pw){u.salt=uid();u.hash=sha256(u.salt+'|'+pw)}
    if(!id){u.id=uid();L.push(u);if(!CUR&&role==='admin'){CUR=u;try{sessionStorage.setItem('byte-user',u.id)}catch(e){}}}
    if(CUR&&CUR.id===u.id)CUR=u;
    save();render();toast('تم حفظ المستخدم');
  }],['إلغاء']]);
}
function delUser(id){const u=db.users.find(x=>x.id===id);
  if(u.role==='admin'&&db.users.filter(x=>x.role==='admin'&&x.active!==false&&x.id!==id).length===0&&db.users.length>1){toast('ما تكدر تحذف آخر مدير');return}
  confirmBox(`حذف المستخدم "${esc(u.name)}"؟`,()=>{db.users=db.users.filter(x=>x.id!==id);if(CUR&&CUR.id===id){CUR=null;try{sessionStorage.removeItem('byte-user')}catch(e){}}save();render()})}

const _origSettings=V.settings;V.settings=()=>_origSettings()+'<div style="margin-top:16px;display:flex;flex-direction:column;gap:16px">'+usersPanel()+themePanel()+servicesPanel()+changelogPanel()+'</div>';
/* ---------- تبويبات الإعدادات ---------- */
let sTab='shop';
const STABS=[['shop','المحل','🏪',['معلومات المحل']],['invoice','الفاتورة','🧾',['ألوان وخطوط الفاتورة','الشعار والتوقيع والختم']],['look','الألوان','🎨',['ألوان الواجهة','حجم الشاشة']],
 ['users','المستخدمين','👥',['المستخدمين والصلاحيات']],['services','الأجور','🛠',['الأجور والخدمات']],['network','الشبكة','🖧',['التشغيل والشبكة']],['backup','النسخ','💾',['النسخ الاحتياطي','مجلد الوصولات الورقية']],
 ['updates','التحديثات','🔄',['تحديث البرنامج','ما الجديد']],['license','الترخيص','🔑',['ترخيص البرنامج']]];
function settingsTabs(){
  const main=$('#main');if(!main||view!=='settings')return;const map={};
  main.querySelectorAll('.panel').forEach(p=>{const h=p.querySelector('h2');if(!h)return;const t=h.textContent.trim();const tab=STABS.find(x=>x[3].some(k=>t.startsWith(k)));p.dataset.stab=tab?tab[0]:'shop';(map[p.dataset.stab]=map[p.dataset.stab]||[]).push(p)});
  if(!map[sTab])sTab='shop';
  let bar=$('#stabBar');if(!bar){bar=document.createElement('div');bar.id='stabBar';const head=main.querySelector('.head');head.after(bar)}
  bar.style.cssText='display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;width:fit-content;max-width:100%;margin-bottom:16px';
  bar.innerHTML=STABS.filter(t=>map[t[0]]).map(([k,t,ic])=>`<button onclick="sTab='${k}';settingsTabs()" style="all:unset;cursor:pointer;padding:6px 11px;border-radius:9px;font-size:13px;white-space:nowrap;${sTab===k?'background:var(--accent);color:var(--accent-ink);font-weight:700':'color:var(--ink)'}">${ic} ${t}</button>`).join('');
  main.querySelectorAll('.panel[data-stab]').forEach(p=>p.style.display=p.dataset.stab===sTab?'':'none');
  main.querySelectorAll('.grid2').forEach(g=>g.style.gridTemplateColumns=[...g.children].filter(c=>c.style.display!=='none').length>1?'':'1fr');
  const hb=main.querySelector('.head .btn.pri');if(hb)hb.style.display=sTab==='shop'?'':'none';
}
/* ---------- أجور وخدمات بالفاتورة (بدون مخزن) ---------- */
const DEF_SERVICES=['أجور عمال','أجور نقل','أجور كرين','أجور تحميل','أجور تنصيب'];
const services=()=>db.settings.services&&db.settings.services.length?db.settings.services:DEF_SERVICES;
function serviceChips(){return `<div class="row" style="margin-top:10px;gap:6px;align-items:center"><span style="font-size:13px;color:var(--muted)">أجور وخدمات (بدون مخزن):</span>${services().map(s=>`<button class="btn sm" onclick="addService(${esc(JSON.stringify(s))})">+ ${esc(s)}</button>`).join('')}<button class="btn sm" onclick="addService('')">+ أخرى</button></div>`}
function addService(name){
  modal('إضافة أجور / خدمة',`<div class="form">
   <label class="f" style="grid-column:1/-1">الوصف<input id="sv_name" value="${esc(name)}" placeholder="مثال: أجور نقل إلى الحلة" list="svList"></label>
   <label class="f">المبلغ<input id="sv_price" inputmode="numeric"></label><label class="f">العدد<input id="sv_qty" inputmode="numeric" value="1"></label>
   ${isSeller()?'':`<label class="f" style="grid-column:1/-1">الكلفة عليك (اختياري — مثل اللي تدفعه للعمال، حتى ينحسب الربح صح)<input id="sv_cost" inputmode="numeric" placeholder="0"></label>`}</div>
   <datalist id="svList">${services().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`,
  [['إضافة للفاتورة','pri',()=>{const n=$('#sv_name').value.trim(),p=N($('#sv_price').value),q=N($('#sv_qty').value)||1,c=N($('#sv_cost')?.value);
    if(!n){toast('اكتب الوصف');return false}if(p<=0){toast('اكتب المبلغ');return false}
    draft.lines.push({itemId:'',service:true,name:n,unit:'خدمة',factor:1,qty:q,price:p,cost:q?c/q:0,note:'',warranty:0});render()}],['إلغاء']]);
  setTimeout(()=>{const x=name?$('#sv_price'):$('#sv_name');if(x)x.focus()},60);
}
const CHANGELOG=[['1.1.0',['الحساب السحابي: البرنامج يشتغل من الموبايل ومن أي مكان عبر الإنترنت، والبيانات تتحدث مباشرة بين الحاسبة والموبايلات (الإعدادات ← السحابة)','قائمة مطوية على شاشات الموبايل الصغيرة']],['1.0.4',['فوارز الآلاف بكل حقول الأرقام بالبرنامج (مثل 15,500 و 1,150,000) حتى تميّز الآحاد والعشرات والمئات بسهولة']],['1.0.3',['زر «حذف» لكل إدخال بصفحة الوارد (شراء): يُنقص الكمية من المخزن ويُرجع المبلغ للقاصة ويحذف باركودات الأجهزة غير المباعة']],['1.0.2',['لوحة التحكم والبطاقات والجداول صارت تتلوّن حسب لون الواجهة المختار','زر «ألوان الواجهة» بالشريط الجانبي لتغيير الألوان بضغطة وحدة']],['1.0.1',['ألوان متعددة للواجهة (10 ألوان + وضع داكن + ألوان مخصصة)','المستخدمين والأدوار: البائع يبيع فقط بدون ما يشوف أسعار الشراء والمخزن والأرباح','تسجيل دخول بكلمة سر، واسم البائع ينحفظ بالفاتورة وتقرير المبيعات حسب البائع','إضافة أجور وخدمات بالفاتورة بدون مخزن: أجور عمال، نقل، كرين، تحميل، تنصيب','الإعدادات صارت بتبويبات مرتبة']],['1.0.0',['الإصدار الأول']]];
function changelogPanel(){return `<div class="panel"><h2>ما الجديد</h2>${CHANGELOG.map(([v,l])=>`<div style="margin-bottom:10px"><b class="num">الإصدار ${v}</b><ul style="margin:6px 0 0;padding-inline-start:20px;line-height:1.9">${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`}
function servicesPanel(){return `<div class="panel"><h2>الأجور والخدمات</h2><p style="color:var(--muted);font-size:13px;margin-top:0">هذي الأزرار تطلع بفاتورة البيع حتى تضيف أجور أو خدمات ما إلها مخزن.</p>
  <div class="row" style="gap:6px">${services().map((s,i)=>`<span class="pill" style="background:var(--surface2);color:var(--ink);font-size:13px;padding:5px 10px">${esc(s)} <a href="#" onclick="db.settings.services=services().filter((x,j)=>j!==${i});save();render();return false" style="color:var(--bad);text-decoration:none;margin-right:4px">✕</a></span>`).join('')}</div>
  <div class="row" style="margin-top:10px"><input id="svNew" placeholder="أجور جديدة، مثال: أجور لحام" style="flex:1;min-width:200px"><button class="btn pri" onclick="const v=$('#svNew').value.trim();if(v){db.settings.services=[...services(),v];save();render()}">إضافة</button></div></div>`}
function listSheet(title,right,head,rows,foot){
  const pages=[];for(let i=0;i<Math.max(rows.length,1);i+=24)pages.push(rows.slice(i,i+24));
  return pages.map((pg,n)=>`<div class="sheet" style="${themeStyle()}">${sheetHead(title,right+(pages.length>1?` · صفحة ${n+1}/${pages.length}`:''))}
   <table class="s-tbl"><thead><tr>${head}</tr></thead><tbody>${pg.join('')||'<tr><td colspan="9">لا توجد بيانات</td></tr>'}</tbody>${n===pages.length-1&&foot?`<tfoot>${foot}</tfoot>`:''}</table>
   ${n===pages.length-1?signBlock():''}${sheetFoot()}</div>`).join('');
}
function printStock(){
  const rows=db.items.map((i,k)=>`<tr><td>${k+1}</td><td class="num">${esc(i.code)}</td><td class="l">${esc(i.name)}</td><td>${esc(i.unit)}</td><td class="num">${fmt(i.qty)}</td><td class="num">${fmt(i.cost)}</td><td class="num">${fmt(i.price)}</td><td class="num">${fmt(stockVal(i))}</td></tr>`);
  doPrint(listSheet('جرد المخزن',`بتاريخ <b class="num">${today()}</b>`,'<th>ت</th><th>الرمز</th><th>المادة</th><th>الوحدة</th><th>الكمية</th><th>سعر الشراء</th><th>سعر البيع</th><th>القيمة</th>',rows,
   `<tr><td colspan="7">إجمالي قيمة المخزن</td><td class="num">${fmt(db.items.reduce((s,i)=>s+stockVal(i),0))}</td></tr>`));
}
function printDebts(){
  const l=db.customers.map(c=>({c,d:custDebt(c.id)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
  const rows=l.map((x,k)=>`<tr><td>${k+1}</td><td class="l">${esc(x.c.name)}</td><td class="num">${esc(x.c.phone)}</td><td>${esc(x.c.address)}</td><td class="num">${fmt(x.d)}</td></tr>`);
  doPrint(listSheet('كشف الديون',`بتاريخ <b class="num">${today()}</b>`,'<th>ت</th><th>الزبون</th><th>الهاتف</th><th>العنوان</th><th>الباقي عليه</th>',rows,
   `<tr><td colspan="4">المجموع</td><td class="num">${fmt(l.reduce((s,x)=>s+x.d,0))}</td></tr>`));
}
function printStatement(id){
  const c=custById(id),inv=db.invoices.filter(i=>i.customerId===id).sort((a,b)=>a.no-b.no);
  const rows=inv.map((i,k)=>`<tr><td>${k+1}</td><td class="num">${invNo(i)}</td><td class="num">${i.date}</td><td class="num">${fmt(net(i))}</td><td class="num">${fmt(paidAll(i))}</td><td class="num">${fmt(remain(i))}</td></tr>`);
  doPrint(listSheet('كشف حساب زبون',`<b>${esc(c.name)}</b>`,'<th>ت</th><th>رقم الفاتورة</th><th>التاريخ</th><th>الصافي</th><th>الواصل</th><th>الباقي</th>',rows,
   `<tr><td colspan="3">المجموع</td><td class="num">${fmt(inv.reduce((s,i)=>s+net(i),0))}</td><td class="num">${fmt(inv.reduce((s,i)=>s+paidAll(i),0))}</td><td class="num">${fmt(custDebt(id))}</td></tr>`));
}
